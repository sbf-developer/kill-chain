name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate scenarios
        run: python -m kc check

      - name: CLI smoke test
        run: |
          python -m kc run 01-legacy-sequential --runs 2000 --no-sensitivity
          python -m kc compare 01-legacy-sequential 02-fused-killweb --runs 1000
          python -m kc audit 04-tight-roe --tamper-demo
          python -m kc cot 02-fused-killweb > /tmp/track.cot
          python -c "import xml.etree.ElementTree as ET; ET.parse('/tmp/track.cot')"
