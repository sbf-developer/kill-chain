[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kchain"
version = "0.3.0"
description = "Kill-chain latency and authority simulator over synthetic data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/sbf-developer/kill-chain"

[project.scripts]
kc = "kc.cli:main"

[tool.setuptools]
packages = ["kc"]
